[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyangrad"
version = "0.1.0"
description = "A small reverse-mode autodiff engine and neural network library built on NumPy."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "numdifftools>=0.9"]

[tool.setuptools]
packages = ["nyangrad"]
