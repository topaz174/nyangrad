[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyangrad"
version = "0.1.0"
description = "A small deep learning framework: reverse-mode autodiff, an nn library, and a strided array with C++/CUDA backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "numdifftools>=0.9", "pybind11>=2.10"]

[tool.setuptools]
packages = ["nyangrad"]
